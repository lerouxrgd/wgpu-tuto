[package]
name = "wgpu-tuto"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
bytemuck = { version = "1", features = ["derive"] }
cgmath = "0.18"
env_logger = "0.11"
futures-lite = "2"
gilrs = "0.11"
log = "0.4"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "hdr",
] }
pollster = "0.4"
tobj = { version = "4", features = ["futures"] }
wgpu = "22.0"
winit = { version = "0.29", default-features = false, features = [
  "rwh_06",
  "x11",
  "wayland",
] }

[build-dependencies]
fs_extra = "1"
